# Every series the board keeps, by id. source: yahoo (yfinance daily close), cboe (Cboe's daily index
# history CSV), fred (fredgraph.csv, no key), cnn (Fear & Greed and, with `part`, its parts by the key CNN gives
# each), llama (DefiLlama), multpl (multpl.com tables), archive (a
# one-time history, by format: coinmetrics, csv, msci, worldbank; fetched while it has no values, never again),
# derived (computed here from the series `from`, by `formula`: data/sources.py DERIVED).
# lag: days from the day a value is dated to when it is published (monthly and weekly data), so it is used only
# from then on. max_age: days without a new value before the series counts as stale (stale series light no signpost).
# Checks (data/observations.py): min / max; positive (default for prices); max_jump (|log change| of a new day,
# default 0.7 for prices); history_from drops earlier values; min_rows for an archive's answer.
# backfill: what carries the series back before its first value, for history (signposts' fits, base rates); a
# list, each reaching further back: { series = ID } scaled to meet it at the join, or { expr = "...", join =
# "level" } taken as it is. The stored values stay as fetched.

# --- the Market page's own indicators (server/app/private/market.py), kept daily here
[GSPC]
source = "yahoo"
symbol = "^GSPC"
name = "S&P 500"
max_age = 5
[DJI]
source = "yahoo"
symbol = "^DJI"
name = "Dow Jones"
max_age = 5
[IXIC]
source = "yahoo"
symbol = "^IXIC"
name = "Nasdaq Composite"
max_age = 5
[BTC]
source = "yahoo"
symbol = "BTC-USD"
name = "Bitcoin"
max_age = 3
backfill = [{ series = "BTC_CM" }]  # Yahoo starts 2014-09-17
[BTC_CM]
source = "archive"
format = "coinmetrics"
symbol = "btc"
until = "2014-12-31"
name = "Bitcoin before 2015 (Coin Metrics)"
min_rows = 1500  # a shorter answer is a partial one: not kept, asked again the next day
[ETH]
source = "yahoo"
symbol = "ETH-USD"
name = "Ethereum"
max_age = 3
[GOLD]
source = "yahoo"
symbol = "GC=F"
name = "Gold (front future)"
max_age = 5
backfill = [{ series = "GOLD_WB" }]  # Yahoo starts 2000-08
[GOLD_WB]
source = "archive"
format = "worldbank"
url = "https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx"
column = "Gold"
name = "Gold, monthly average before 2001 (World Bank)"
min_rows = 700  # a shorter answer is a partial one: not kept, asked again the next day
[FG]
source = "cnn"
name = "CNN Fear & Greed"
max_age = 5
backfill = [{ series = "FG_HIST", join = "level" }]  # CNN gives two years
[FG_HIST]
source = "archive"
format = "csv"
url = "https://raw.githubusercontent.com/whit3rabbit/fear-greed-data/main/fear-greed.csv"
date = "Date"
column = "Fear Greed"
name = "CNN Fear & Greed from 2011 (collected on GitHub; the 478 days it shares with CNN agree within 0.005)"
min = 1  # one 0 in 2014 is a gap in the collection
min_rows = 3500  # a shorter answer is a partial one: not kept, asked again the next day
[FG_MOMENTUM]
source = "cnn"
part = "market_momentum_sp500"
name = "F&G: S&P 500 momentum"
max_age = 5
[FG_STRENGTH]
source = "cnn"
part = "stock_price_strength"
name = "F&G: stock price strength"
max_age = 5
[FG_BREADTH]
source = "cnn"
part = "stock_price_breadth"
name = "F&G: stock price breadth"
max_age = 5
[FG_PUTCALL]
source = "cnn"
part = "put_call_options"
name = "F&G: put / call options"
max_age = 5
[FG_VIX]
source = "cnn"
part = "market_volatility_vix"
name = "F&G: market volatility"
max_age = 5
[FG_SAFEHAVEN]
source = "cnn"
part = "safe_haven_demand"
name = "F&G: safe haven demand"
max_age = 5
[FG_JUNK]
source = "cnn"
part = "junk_bond_demand"
name = "F&G: junk bond demand"
max_age = 5
[AHR999]
source = "derived"
formula = "ahr999"
from = "BTC"
name = "AHR999"
max_age = 3

