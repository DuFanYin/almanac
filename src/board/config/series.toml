# --- rates and credit (FRED)
[DGS10]
source = "fred"
symbol = "DGS10"
name = "10-year Treasury yield"
max_age = 7
[UST10_TR]
source = "derived"
formula = "par_bond"  # each day a 10-year bond at par at that day's yield, coupons included
from = "DGS10"
years = 10
name = "10-year Treasury, total return (from its yield)"
positive = true
max_age = 7
[DGS2]
source = "fred"
symbol = "DGS2"
name = "2-year Treasury yield"
max_age = 7
[DGS3MO]
source = "fred"
symbol = "DGS3MO"
name = "3-month Treasury yield"
max_age = 7
[DTB3]
source = "fred"
symbol = "DTB3"
name = "3-month bill, secondary market"
max_age = 7
[T10Y3M]
source = "fred"
symbol = "T10Y3M"
name = "10-year minus 3-month"
max_age = 7
[HY]
source = "fred"
symbol = "BAMLH0A0HYM2"
name = "High-yield spread (OAS)"
max_age = 7
backfill = [{ series = "BAA10Y" }]  # FRED keeps only the last three years of the ICE series
[BAA10Y]
source = "fred"
symbol = "BAA10Y"
name = "Moody's Baa minus 10-year Treasury"
max_age = 7
[DFF]
source = "fred"
symbol = "DFF"
name = "Fed funds effective rate"
max_age = 7
[T5YIE]
source = "fred"
symbol = "T5YIE"
name = "5-year breakeven inflation"
max_age = 7
[DFII10]
source = "fred"
symbol = "DFII10"
name = "10-year real yield"
max_age = 7
backfill = [{ series = "TIPS10_FED", join = "level" }, { expr = "DGS10 - yoy(CPI) * 100", join = "level" }]  # FRED from 2003; the Fed's TIPS curve from 1999; before, the 10-year less CPI inflation
[TIPS10_FED]
source = "archive"
format = "csv"
url = "https://www.federalreserve.gov/data/yield-curve-tables/feds200805.csv"
date = "Date"
column = "TIPSPY10"
name = "10-year TIPS par yield from 1999 (Federal Reserve, Gurkaynak-Sack-Wright)"
min_rows = 6000  # a shorter answer is a partial one: not kept, asked again the next day

# --- the economy (FRED; monthly values are dated the first of their month and published weeks later)
