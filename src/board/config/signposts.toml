# --- sentiment and trend
[[signpost]]
id = "trend_down"
driver = "Sentiment and trend"
name = "S&P 500 over its 200-day mean"
value = "gap(GSPC, 290)"  # 200 trading days (the expression language counts calendar days)
red = "< 0"
yellow = "< 0.02"
expect = [
  { factor = "stocks", way = "down", days = [0, 182], why = "trends persist: below its long average a market tends to keep falling" },
  { factor = "unemp", way = "up", days = [0, 365], why = "markets lead the economy" },
  { factor = "stocks", way = "wider", days = [0, 182], why = "falling markets are more volatile" },
]

[[signpost]]
id = "fear_extreme"
