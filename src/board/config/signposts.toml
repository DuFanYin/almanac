value = "ann(CORE_PCE, 91) - yoy(CORE_PCE)"
red = "> 0.005"
yellow = "> 0.002"
group = "inflation"
expect = [
  { factor = "infl", way = "up", days = [0, 365], why = "price pressure persists: a faster pace now shows in the yearly rate" },
  { factor = "rate10", way = "up", days = [0, 182], why = "markets price more tightening" },
]

[[signpost]]
id = "inflation_high"
driver = "Inflation"
name = "Core PCE, 12-month"
value = "yoy(CORE_PCE)"
red = "> 0.035"
yellow = "> 0.03"
group = "inflation"
expect = [
  { factor = "infl", way = "up", days = [0, 1095], why = "high inflation takes years to bring down" },
  { factor = "rate10", way = "up", days = [0, 365], why = "the Fed keeps tightening while it is high" },
]

