# Signposts: one value each (core/expr.py), red and yellow lines (for the page, the rules and the alerts), a group
# (signposts of one group measure the same thing: in the world their pushes are averaged, one reading in the middle a
# vote for usual (the owner, 2026-10-31); "vol" is the market's fear: the VIX, its term structure, the Fear & Greed
# index, the MOVE), and what each says about the factors:
# expect: what it says about the factors (config/factors.toml), each a mechanism one would defend without the
# data: the factor, which way it moves more than usual (up, down) or how its moves spread (wider, narrower: larger or
# smaller moves either way), over which days from the day, and why. The
# stretches measured (run.py timescales) size it; a measure that goes the other way, or a move with no expectation,
# is not used (plan section 13.8). Written 10-30, after the measures were seen: only textbook mechanisms, none
# that only the data suggested; the spreads added 10-31 (volatility persists). The owner's beliefs that were rules
# (buy back after the Nasdaq-100 falls, buy in extreme fear) are expectations since 10-31, marked so in their why: the
# data sizes them like the rest, a weak one counts for little. The Bitcoin ones have none (Bitcoin has no factor).

# --- growth and jobs
[[signpost]]
id = "growth_falling"
driver = "Growth"
name = "Industrial production, 6-month change"
value = "ret(INDPRO, 182)"
red = "< -0.01"
yellow = "< 0.005"
group = "growth"
expect = [
  { factor = "unemp", way = "up", days = [0, 365], why = "output falls first; hiring follows within the year" },
  { factor = "unemp", way = "down", days = [365, 1095], why = "recoveries: unemployment falls back after a downturn" },
  { factor = "rate10", way = "down", days = [0, 365], why = "growth fears and the Fed's cuts pull yields down" },
]

[[signpost]]
id = "payrolls_weak"
driver = "Growth"
name = "Payrolls, 3-month change"
value = "ret(PAYEMS, 91)"
red = "< 0"
yellow = "< 0.002"
group = "labor"
expect = [
  { factor = "unemp", way = "up", days = [0, 365], why = "fewer jobs now is more unemployed within the year" },
  { factor = "unemp", way = "down", days = [365, 1095], why = "recoveries: unemployment falls back after a downturn" },
  { factor = "rate10", way = "down", days = [0, 365], why = "growth fears and the Fed's cuts pull yields down" },
]

[[signpost]]
id = "sahm"
driver = "Growth"
name = "Sahm rule (real time)"
value = "SAHM"
red = ">= 0.5"
yellow = ">= 0.3"
group = "labor"
expect = [
  { factor = "unemp", way = "up", days = [0, 182], why = "it fires once unemployment is rising, which keeps on for months" },
  { factor = "unemp", way = "down", days = [365, 1095], why = "recoveries: unemployment falls back after a downturn" },
  { factor = "rate10", way = "down", days = [0, 365], why = "the Fed cuts into a recession" },
]

[[signpost]]
id = "claims_rising"
driver = "Growth"
name = "Jobless claims, 4-week mean over its 1-year low"
value = "mean(ICSA, 28) / low(mean(ICSA, 28), 365) - 1"
red = "> 0.20"
yellow = "> 0.10"
group = "labor"
expect = [
  { factor = "unemp", way = "up", days = [0, 365], why = "layoffs show in claims before the unemployment rate" },
  { factor = "rate10", way = "down", days = [0, 365], why = "growth fears and the Fed's cuts pull yields down" },
]

# --- inflation
