  { factor = "stocks", way = "up", days = [30, 91], why = "the owner's belief (it was the fear ladder): in 2011-2026 the 20-60 days after extreme fear rose about twice as much as usual" },
  { factor = "stocks", way = "wider", days = [0, 30], why = "fear comes with large daily swings" },
]

[[signpost]]
id = "greed_extreme"
